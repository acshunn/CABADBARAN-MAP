<style>
:root{
  --ink:#10261d; --ink2:#4a5d53; --glass:#f7fbf4; --glass-strong:#f7fbf4;
  --line:rgba(16,38,29,.14); --chip:rgba(16,38,29,.06); --brand:#0f4a35; --leaf:#3f8f2a;
  --lagoon:#0b7a99; --sun:#ffc531; --focus:#0a64c8; --warn:#8a5a00; --warnbg:rgba(255,197,49,.22);
  --shadow:0 12px 44px rgba(7,28,20,.30); --topbar:60px; --r:18px;
  --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e8f3ec; --ink2:#a9c0b3; --glass:#0d201a; --glass-strong:#0d201a;
    --line:rgba(232,243,236,.16); --chip:rgba(232,243,236,.09); --brand:#9fe0bd; --leaf:#7cc65a;
    --lagoon:#5cc7e6; --focus:#7db8ff; --warn:#ffd77a; --warnbg:rgba(255,197,49,.16);
  }
}
:root[data-theme="dark"]{
  --ink:#e8f3ec; --ink2:#a9c0b3; --glass:#0d201a; --glass-strong:#0d201a;
  --line:rgba(232,243,236,.16); --chip:rgba(232,243,236,.09); --brand:#9fe0bd; --leaf:#7cc65a;
  --lagoon:#5cc7e6; --focus:#7db8ff; --warn:#ffd77a; --warnbg:rgba(255,197,49,.16);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#a1d8d6;color:var(--ink);font-family:var(--font-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}

/* ---------- map viewport ---------- */
#viewport{position:absolute;inset:0;z-index:2;contain:layout paint;overflow:hidden;touch-action:none;cursor:grab;outline-offset:-4px;user-select:none;-webkit-user-select:none}
#viewport.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:1264px;height:843px;transform-origin:0 0}
#base{position:absolute;inset:0;background:var(--map) 0 0/100% 100% no-repeat}
#app.muted #base{filter:saturate(.45) brightness(.88) contrast(.95)}

/* ---------- markers ---------- */
#markers{position:absolute;inset:0}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.mk:focus{outline:none}
.part{position:absolute;cursor:pointer;transition:background .2s,box-shadow .2s}
.part.icon{border-radius:50%}
.part.lbl{border-radius:18px}
.mag{position:absolute;border-radius:50%;opacity:0;visibility:hidden;transform:scale(.8);pointer-events:none;
  background:var(--map) 0 0 no-repeat;border:3px solid #fff;
  box-shadow:0 0 0 3px var(--sun),0 6px 16px rgba(0,0,0,.45);
  transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.3,1.2),visibility 0s .22s}
.mk:hover .mag,.mk.focus .mag,.mk.sel .mag{opacity:1;visibility:visible;transform:scale(1);transition-delay:0s}
.mk:hover .lbl,.mk.focus .lbl,.mk.sel .lbl{box-shadow:0 0 0 3px var(--sun),0 6px 16px rgba(0,0,0,.4)}
.mk.sel .icon::after{content:"";position:absolute;inset:calc(-9px*var(--inv));border-radius:50%;border:3px solid var(--sun);animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.8);opacity:.95}100%{transform:scale(1.55);opacity:0}}
.mk.focus .part{outline:3px solid #fff;outline-offset:2px}
.mk.dim .part{background:rgba(236,244,236,.58)}
.mk.dim .mag{display:none}
.mk.gone .part{background:rgba(226,238,228,.93);pointer-events:none}
.mk.gone .mag{display:none}
.mk.dim.sel .part,.mk.gone.sel .part{background:transparent}

/* ---------- glass ---------- */
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 28px rgba(7,28,20,.26)}

/* ---------- top bar ---------- */
#topbar{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));height:48px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;z-index:30}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 0 auto}
.brand svg{width:26px;height:26px;color:var(--leaf);flex:none}
.brand b{font-family:var(--font-d);font-size:18px;line-height:1;letter-spacing:-.01em;color:var(--brand);white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px;white-space:nowrap}
#searchbox{position:relative;flex:1 1 auto;max-width:520px;margin:0 auto}
#q{width:100%;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:0 36px 0 38px;font-size:15px}
#q::placeholder{color:var(--ink2)}
#q:focus{background:var(--glass-strong);outline-offset:1px}
#searchbox .ico{position:absolute;left:12px;top:9px;width:18px;height:18px;color:var(--ink2);pointer-events:none}
#qclear{position:absolute;right:4px;top:4px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;display:none;color:var(--ink2)}
#qclear svg{width:16px;height:16px}
#suggest{position:absolute;left:0;right:0;top:44px;border-radius:16px;padding:6px;max-height:min(60vh,420px);overflow:auto;display:none;z-index:40;background:var(--glass-strong)}
#suggest.open{display:block}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px}
.sg[aria-selected="true"],.sg:hover{background:var(--chip)}
.sg .t{font-weight:600;font-size:14.5px}
.sg .s{font-size:12.5px;color:var(--ink2)}
.sg .why{margin-left:auto;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.sgnone{padding:12px 12px;font-size:14px;color:var(--ink2);line-height:1.45}
.sgnone b{color:var(--ink)}
.swatch{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.8),0 1px 4px rgba(0,0,0,.3)}
.swatch svg{width:62%;height:62%;display:block}
.swatch.sm{width:24px;height:24px}
.tbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:14px;white-space:nowrap}
.tbtn svg{width:18px;height:18px;flex:none}
.tbtn:hover{background:var(--glass-strong)}
.tbtn[aria-expanded="true"]{background:var(--brand);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tbtn[aria-expanded="true"]{color:#0b2018}}
:root[data-theme="dark"] .tbtn[aria-expanded="true"]{color:#0b2018}

/* ---------- side drawers ---------- */
#legend{position:absolute;z-index:22;right:var(--lg-right,12px);top:var(--lg-top,70px);width:var(--lg-w,340px);height:var(--lg-h,calc(100% - 84px));border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong);
  opacity:0;visibility:hidden;transform:translate3d(40px,0,0);transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .26s}
#legend.open{opacity:1;visibility:visible;transform:none;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s}
#city{position:absolute;z-index:20;left:12px;top:70px;bottom:14px;width:360px;border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong);
  opacity:0;visibility:hidden;transform:translate3d(-40px,0,0);transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .26s}
#city.open{opacity:1;visibility:visible;transform:none;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-family:var(--font-d);font-size:20px;letter-spacing:-.01em;color:var(--brand);flex:1}
.xbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;flex:none}
.xbtn svg{width:16px;height:16px}
.xbtn:hover{background:var(--glass-strong)}
.dbody{overflow:auto;padding:12px 12px 16px;flex:1;overscroll-behavior:contain}
.sec{margin:14px 6px 6px;font-size:13px;font-weight:700;color:var(--ink2)}
.sec:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:7px 8px}
.row:hover{background:var(--chip)}
.row[aria-pressed="true"]{background:var(--glass-strong);border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.row .nm{font-weight:600;font-size:14.5px;line-height:1.2}
.row .ds{display:block;font-weight:400;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.3}
.row .ct{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--chip);border-radius:999px;padding:2px 9px;flex:none}
.allico{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.allico svg{width:16px;height:16px}
.themeico{width:30px;height:30px;border-radius:50%;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--brand)}
.themeico svg{width:16px;height:16px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:2px 6px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tog{display:flex;align-items:center;gap:10px;margin:8px 6px;font-size:14px;font-weight:500}
.tog input{width:18px;height:18px;accent-color:var(--brand)}
.roadkey{margin:8px 6px 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.roadkey div{display:flex;align-items:center;gap:10px;margin:3px 0}
.roadkey i{display:block;width:34px;height:0;border-top:3px solid}
.roadkey .maj{border-color:#f0b429;border-top-style:solid;border-top-width:4px}
.roadkey .van{border-color:#7b3fbf;border-top-style:dashed}
.roadkey .boat{border-color:#1f86c8;border-top-style:dashed}
.roadkey small{color:var(--ink2);font-size:11.5px;margin-left:2px}
.roadkey .sec2{border-color:#9aa5a0}
.roadkey .bnd{border-color:#3a5a48;border-top-width:2px;border-top-style:dashed}
.roadkey p{margin:8px 0 0}
.count{margin:10px 6px 4px;font-size:13px;color:var(--ink2)}
.reset{margin:6px 6px 0;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}

/* ---------- info panel ---------- */
#info{background:var(--glass-strong);position:absolute;z-index:25;width:min(440px,calc(100% - 24px));max-height:calc(100% - 96px);top:calc(50% + 28px);left:var(--px,50%);
  transform:translate(-50%,-50%) scale(.96);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;visibility:hidden;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s,left .35s}
#info.open{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s,left .35s}
#info .ihead{display:flex;align-items:flex-start;gap:12px;padding:16px 14px 12px 18px}
#info h2{margin:0;font-family:var(--font-d);font-size:25px;line-height:1.08;letter-spacing:-.015em;color:var(--brand)}
#info h2:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px 3px 4px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.chip .swatch{width:20px;height:20px}
.chip.plain{padding-left:10px}
#info .ibody{overflow:auto;padding:0 18px 18px;overscroll-behavior:contain}
.thumb{position:relative;height:118px;border-radius:14px;overflow:hidden;margin:2px 0 12px;background:#2a5;box-shadow:inset 0 0 0 1px var(--line)}
.thumb .im{position:absolute;left:50%;top:50%;width:1896px;height:1265px;background:var(--map) 0 0/100% 100% no-repeat}
.thumb .pin-unused{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--sun);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.thumb figcaption{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:600;color:#fff;background:rgba(10,30,22,.65);padding:2px 8px;border-radius:999px}
.meta{font-size:13.5px;color:var(--ink2);line-height:1.5}
.meta b{color:var(--ink);margin-right:4px}
.lead{font-size:16px;line-height:1.5;margin:0 0 10px;font-weight:500}
.ibody p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:var(--ink)}
.ibody h3{margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--ink2)}
.ibody ul{margin:0 0 6px;padding-left:19px}
.ibody li{margin:0 0 5px;font-size:14.5px;line-height:1.5}
.notice{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin:6px 0 10px}
.notice.na{background:var(--chip);border:1px dashed var(--line)}
.coords{font-variant-numeric:tabular-nums;font-size:14px}
.vstat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.45}
.badge{flex:none;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--ink)}
.badge.v{background:rgba(63,143,42,.18);border-color:rgba(63,143,42,.5)}
.badge.p{background:var(--warnbg);border-color:rgba(200,140,0,.5)}
.srcs{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px}
.srcs li{margin:0 0 3px}
.srcs a{color:var(--focus)}

/* ---------- city drawer ---------- */
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.fact{background:var(--chip);border-radius:12px;padding:9px 11px;min-width:0}
.fact b{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.fact span{display:block;font-size:14.5px;font-weight:600;margin-top:2px;line-height:1.3}
.fact small{display:block;font-size:11.5px;color:var(--ink2);font-weight:400;margin-top:2px;line-height:1.3}
details.acc{border:1px solid var(--line);border-radius:14px;margin:0 0 8px;background:var(--chip)}
details.acc>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .ac{padding:0 14px 12px}
.ac p,.ac li{font-size:14px;line-height:1.55;margin:0 0 8px}
.ac ul{margin:0;padding-left:18px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pills button{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pills button:hover{border-color:var(--brand)}
.flow{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.flow div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.flow .sw{width:26px;height:26px}
.flow em{font-style:normal;color:var(--ink2);font-size:12px;margin-left:auto}

/* ---------- controls ---------- */
#controls{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;flex-direction:column;gap:8px;transition:transform .26s,opacity .2s}
#controls .grp{border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
#controls button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
#controls button+button{border-top:1px solid var(--line)}
#controls button:hover:not(:disabled){background:var(--chip)}
#controls button:disabled{opacity:.4;cursor:default}
#controls svg{width:20px;height:20px}
#scalebar{position:absolute;left:14px;bottom:14px;z-index:5;font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;transition:left .3s}
#scalenote{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;font-size:11.5px;font-weight:600;color:#fff;background:rgba(8,28,20,.55);padding:4px 10px;border-radius:999px;pointer-events:none}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;font-size:12.5px;font-weight:600;color:#fff;background:rgba(8,28,20,.62);padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#hint.off{opacity:0}

/* ---------- tooltip / status ---------- */
#tip{position:absolute;z-index:35;pointer-events:none;background:#0d2c21;color:#fff;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 8px)) scale(.96);transition:opacity .15s,transform .15s;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#tip.on{opacity:1;transform:translate(-50%,calc(-100% - 8px))}
#tip small{display:block;font-weight:500;opacity:.8;font-size:11.5px;margin-top:1px}
#tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#loading{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(160deg,#0e3a2b,#0b5a63);color:#fff;text-align:center;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading .box{max-width:340px;padding:24px}
#loading h1{font-family:var(--font-d);font-size:26px;margin:14px 0 6px;letter-spacing:-.01em}
#loading p{margin:0;opacity:.85;font-size:14.5px;line-height:1.5}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--sun);margin:0 auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading button{margin-top:16px;border:0;border-radius:999px;padding:9px 18px;font-weight:700;background:var(--sun);color:#1a2b00}

/* ---------- tropical background (beneath the map) ---------- */
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;contain:layout paint;pointer-events:none}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#a3dad8 0%,#a1d8d6 45%,#86c7c5 100%)}
#hills{position:absolute;left:0;bottom:0;width:100%;height:36%}
#fronds{position:absolute;left:0;top:0;width:100%;height:100%}
.cloud{position:absolute;left:0;opacity:.92;animation:drift linear infinite;
  background:radial-gradient(ellipse 30% 52% at 22% 62%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse 34% 70% at 45% 42%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse 30% 56% at 70% 58%,#fff 0,rgba(255,255,255,0) 100%),radial-gradient(ellipse 24% 44% at 88% 66%,#fff 0,rgba(255,255,255,0) 100%)}
@keyframes drift{from{transform:translate3d(-45vw,0,0)}to{transform:translate3d(110vw,0,0)}}
.bird{position:absolute;left:0;width:22px;height:10px;opacity:.75;animation:fly linear infinite}
.bird svg{width:100%;height:100%;display:block;overflow:visible}
.bird path{transform-box:fill-box;transform-origin:50% 100%;animation:flap .85s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate3d(-6vw,0,0)}50%{transform:translate3d(50vw,-16px,0)}to{transform:translate3d(108vw,6px,0)}}
@keyframes flap{to{transform:scaleY(.4)}}
#app.paused .cloud,#app.paused .bird,#app.paused .bird path,#app.moving .cloud,#app.moving .bird,#app.moving .bird path{animation-play-state:paused}
#app.lite .cloud,#app.lite .bird,#app.lite .bird path{animation:none}
#app.lite .cloud,#app.lite .bird{transform:translate3d(var(--x,20vw),0,0)}

/* ---------- legend + drawers: responsive ---------- */
#app.legend-open #controls{transform:translate3d(calc(-1*(var(--lg-right,12px) + var(--lg-w,340px))),0,0)}
@media (max-width:1024px){
  /* tablet and phone: right-anchored full-height drawer */
  #legend{right:0;top:0;bottom:0;height:100vh;height:100dvh;width:min(86vw,320px);border-radius:20px 0 0 20px;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0;z-index:40}
  #app.legend-open #controls{transform:translate3d(-332px,0,0)}
  #city{width:320px}
}
@media (max-width:760px){
  #topbar{padding-left:10px;gap:6px}
  .brand b,.brand small{display:none}
  .tbtn{padding:0 10px}.tbtn span{display:none}
  .tbtn svg{width:20px;height:20px}
  #legend{width:min(88vw,360px)}
  #app.legend-open #controls{opacity:0;pointer-events:none}
  #city{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;height:min(66dvh,560px);transform:translate3d(0,40px,0)}
  #city.open{transform:none}
  #info{left:8px!important;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:56dvh;transform:translate3d(0,40px,0);border-radius:22px}
  #info.open{transform:none}
  #controls{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
  #controls button{width:42px;height:42px}
  #hint,#scalenote{display:none}
  #app.sheet-open #controls{opacity:0;pointer-events:none}
  #info h2{font-size:22px}
  .thumb{height:96px}
}
@media (max-height:480px) and (orientation:landscape){
  #topbar{height:42px;top:6px}
  #q{height:32px}.tbtn{height:32px}
  #controls{bottom:12px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .cloud,.bird{transform:translate3d(var(--x,20vw),0,0)}
}
</style>
</head>
<body>
<div id="app">
  <div id="bg" aria-hidden="true">
    <div id="sky"></div>
    <svg id="hills" viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300V170Q120 90 250 150T520 120T800 160T1050 100T1200 140V300Z" fill="#7fb6b0" opacity=".45"/><path d="M0 300V220Q160 150 330 205T640 190T940 215T1200 180V300Z" fill="#5c9b6a" opacity=".6"/></svg>
    <div class="cloud" style="top:6%;width:340px;height:110px;--x:8vw;animation-duration:150s;animation-delay:-40s"></div>
    <div class="cloud" style="top:17%;width:260px;height:86px;--x:62vw;animation-duration:190s;animation-delay:-120s;opacity:.8"></div>
    <div class="cloud" style="top:30%;width:300px;height:96px;--x:30vw;animation-duration:170s;animation-delay:-15s;opacity:.7"></div>
    <div class="cloud" style="top:44%;width:240px;height:76px;--x:80vw;animation-duration:210s;animation-delay:-90s;opacity:.55"></div>
    <div class="bird" style="top:11%;--x:24vw;animation-duration:68s;animation-delay:-20s"><svg viewBox="0 0 24 10"><path d="M1 8Q6 0 12 6Q18 0 23 8" fill="none" stroke="#1f4636" stroke-width="1.7" stroke-linecap="round"/></svg></div>
    <div class="bird" style="top:19%;width:16px;height:7px;--x:70vw;animation-duration:84s;animation-delay:-55s"><svg viewBox="0 0 24 10"><path d="M1 8Q6 0 12 6Q18 0 23 8" fill="none" stroke="#1f4636" stroke-width="1.9" stroke-linecap="round"/></svg></div>
    <div class="bird" style="top:27%;width:19px;height:8px;--x:46vw;animation-duration:96s;animation-delay:-8s"><svg viewBox="0 0 24 10"><path d="M1 8Q6 0 12 6Q18 0 23 8" fill="none" stroke="#1f4636" stroke-width="1.8" stroke-linecap="round"/></svg></div>

  </div>
  <div id="viewport" tabindex="0" aria-label="Interactive map of Cabadbaran City. Drag to pan, scroll or pinch to zoom, arrow keys to move, plus and minus to zoom, Tab to move between places.">
        <div id="stage">
      <div id="base" role="img" aria-label="Illustrated tourism map of Cabadbaran City, Agusan del Norte"></div>
      <div id="markers"></div>
    </div>
  </div>

  <header id="topbar" class="glass">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-9 5-15 16-16 0 10-5 16-13 16-1 0-2-.1-3-.3zM4 20c3-6 6-9 11-12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Cabadbaran City</b><small>Discover nature, Discover Cabadbaran</small></div>
    </div>
    <div id="searchbox" role="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search places, e.g. Tumipi, café, Soriano" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" aria-label="Search places on the map">
      <button id="qclear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <div id="suggest" class="glass" role="listbox" aria-label="Search results"></div>
    </div>
    <button id="btnLegend" class="tbtn" type="button" aria-expanded="false" aria-controls="legend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Legend</span></button>
    <button id="btnCity" class="tbtn" type="button" aria-expanded="false" aria-controls="city"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>About the city</span></button>
  </header>

vp.addEventListener("keydown",e=>{
  if(e.target!==vp) return;
  const step=70; let h=true;
  if(e.key==="ArrowLeft") view.x+=step; else if(e.key==="ArrowRight") view.x-=step;
  else if(e.key==="ArrowUp") view.y+=step; else if(e.key==="ArrowDown") view.y-=step;
  else if(e.key==="+"||e.key==="=") return zoomBy(1.4);
  else if(e.key==="-"||e.key==="_") return zoomBy(1/1.4);
  else if(e.key==="0") return resetView();
  else h=false;
  if(h){ e.preventDefault(); cancelAnim(); clampView(view); atFit=false; schedule(); }
});
function zoomBy(f){
  const ns=Math.min(maxS,Math.max(minS,view.s*f));
  flyTo((vw/2-view.x)/view.s,(vh/2-view.y)/view.s,ns,vw/2,vh/2,380);
}
$("#zin").onclick=()=>zoomBy(1.5);
$("#zout").onclick=()=>zoomBy(1/1.5);
$("#zreset").onclick=()=>resetView();
if(document.fullscreenEnabled){ $("#fsgrp").hidden=false; $("#zfull").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} }; }
/* Layout changes (window resize, orientation, mobile browser bars) keep the current zoom and centre where possible. */
let roRaf=0;
function onResize(){
  if(!ready) return;
  const c={x:(vw/2-view.x)/view.s,y:(vh/2-view.y)/view.s}, was=atFit;
  measure();
  if(was) setView(homeView());
  else { const s=Math.min(maxS,Math.max(minS,view.s)); setView({s,x:vw/2-c.x*s,y:vh/2-c.y*s}); }
  placeLegend(); layoutInfo();
}
new ResizeObserver(()=>{ cancelAnimationFrame(roRaf); roRaf=requestAnimationFrame(onResize); }).observe(vp);
document.addEventListener("visibilitychange",()=>app.classList.toggle("paused",document.hidden));

/* =====================================================================
   MapMarker : one element per location record
   ===================================================================== */
const markersEl=$("#markers"), tip=$("#tip");
const MAG=1.22;
function buildMarkers(){
  markersEl.innerHTML="";
  LOCATIONS.forEach(loc=>{
    if(!loc.pos) return;
    const p=loc.pos, c=catOf(loc.cat), R=p.r*MAG;
    const el=document.createElement("div");
    el.className="mk"; el.dataset.id=loc.id; el.tabIndex=0; el.setAttribute("role","button");
    el.setAttribute("aria-label",`${loc.name}, ${c.label}. Press Enter for details.`);
    const iconPart=!p.r?"":`<span class="part icon" style="left:${p.cx-p.r}px;top:${p.cy-p.r}px;width:${p.r*2}px;height:${p.r*2}px">
      <i class="mag" style="left:${p.r-R}px;top:${p.r-R}px;width:${R*2}px;height:${R*2}px;background-size:${MAP_W*MAG}px ${MAP_H*MAG}px;background-position:${R-p.cx*MAG}px ${R-p.cy*MAG}px"></i></span>`;
    const lbl=p.label?`<span class="part lbl" style="left:${p.label[0]}px;top:${p.label[1]}px;width:${p.label[2]}px;height:${p.label[3]}px"></span>`:"";
    el.innerHTML=iconPart+lbl;
    el.addEventListener("click",()=>{ if(moved) return; selectLoc(loc.id); });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectLoc(loc.id);} });
    el.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse" && !drag) showTip(loc,el); });
    el.addEventListener("pointerleave",hideTip);
    el.addEventListener("focus",()=>{ if(el.matches(":focus-visible")){ el.classList.add("focus"); showTip(loc,el); ensureVisible(loc);} });
    el.addEventListener("blur",()=>{ el.classList.remove("focus"); hideTip(); });
    markersEl.appendChild(el);
  });
}
function showTip(loc,el){
  const r=(el.querySelector(".icon")||el.querySelector(".lbl")).getBoundingClientRect(), a=app.getBoundingClientRect();
  tip.innerHTML=`${esc(loc.name)}<small>${esc(catOf(loc.cat).label)} · click for details</small>`;
  tip.style.left=(r.left+r.width/2-a.left)+"px"; tip.style.top=(r.top-a.top)+"px"; tip.classList.add("on");
}
function hideTip(){ tip.classList.remove("on"); }
function ensureVisible(loc){
  const c=centerOf(loc), sx=view.x+c.x*view.s, sy=view.y+c.y*view.s, f=freeRect();
  if(sx<f.l||sx>f.r||sy<f.t||sy>f.b) flyTo(c.x,c.y,Math.max(view.s,minS*1.8),(f.l+f.r)/2,(f.t+f.b)/2);
}
function matches(loc,f=state.filter){
  if(f.kind==="all") return true;
  if(f.kind==="cat") return catIds(loc).includes(f.id);
  return loc.themes.includes(f.id);
}
function paintMarkers(){
  markersEl.querySelectorAll(".mk").forEach(el=>{
    const loc=byId[el.dataset.id], ok=matches(loc);
    el.classList.toggle("dim",!ok && state.fadeMode==="fade");
    el.classList.toggle("gone",!ok && state.fadeMode==="hide");
    el.classList.toggle("sel",state.sel===loc.id);
    el.setAttribute("aria-pressed",state.sel===loc.id?"true":"false");
    el.tabIndex = (!ok && state.fadeMode==="hide") ? -1 : 0;
  });
}

   ===================================================================== */
const info=$("#info");
function section(title,html){ return html?`<h3>${title}</h3>${html}`:""; }
const ul = a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
function renderInfo(loc){
  const placed=!!loc.pos;
  const chips=[loc.cat,...loc.cats].map(id=>{const x=catOf(id);return `<span class="chip">${swatch(x,20)}${esc(x.label)}</span>`}).join("");
  const body=[];
  if(placed){
    const cc=centerOf(loc);
    body.push(`<figure class="thumb" style="margin-left:0;margin-right:0" aria-hidden="true"><div class="im" style="transform:translate(${-cc.x*1.5}px,${-cc.y*1.5}px)"></div><figcaption>Detail from the primary map</figcaption></figure>`);
  }else{
    body.push(`<div class="notice na"><b>Not placed on the map.</b> ${esc(loc.placeNote||"Its position could not be verified.")}</div>`);
  }
  if(loc.type||loc.locText) body.push(`<p class="meta">${loc.type?`<b>Type</b> ${esc(loc.type)}`:""}${loc.type&&loc.locText?"<br>":""}${loc.locText?`<b>Location</b> ${esc(loc.locText)}`:""}</p>`);
  if(loc.overview&&loc.short&&loc.overview.startsWith(loc.short)) body.push(`<p class="lead">${esc(loc.overview)}</p>`);
  else{ if(loc.short) body.push(`<p class="lead">${esc(loc.short)}</p>`); if(loc.overview) body.push(`<p>${esc(loc.overview)}</p>`); }
  if(loc.background) body.push(`<h3>Background story</h3><p>${esc(loc.background)}</p>`);
  (loc.details||[]).forEach(d=>body.push(`<p>${esc(d)}</p>`));
  body.push(section("Activities",ul(loc.activities)));
  if(loc.unavailable) body.push(`<div class="notice na"><b>Information about this location is currently unavailable.</b></div>`);
  body.push(section("Notable features",ul(loc.features)));
  body.push(section("Visitor experience",ul(loc.experience)));
  body.push(section("Facilities and costs",ul(loc.facilities)));
  body.push(section("Getting there and access",ul(loc.access)));
  if(loc.important) body.push(`<div class="notice"><b>Important:</b> ${esc(loc.important)}</div>`);
  if(loc.coords) body.push(section("Coordinates",`<p class="coords">${loc.coords.lat.toFixed(4)}° N, ${loc.coords.lng.toFixed(4)}° E<br><span style="color:var(--ink2);font-size:12.5px">${esc(loc.coords.note)}</span></p>`));
  if(loc.flags&&loc.flags.length) body.push(`<h3>Needs verification</h3><div class="notice">${ul(loc.flags)}</div>`);
  const badge={provided:["Supplied information","v"],verified:["Verified","v"],partial:["Partly verified","p"],maponly:["Name from the map only",""],index:["Index entry",""]}[loc.status]||["",""];
  const srcs=loc.sources.length?`<ul class="srcs">${loc.sources.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`:esc(s.label)}</li>`).join("")}</ul>`:"";
  body.push(`<div class="vstat"><span class="badge ${badge[1]}">${badge[0]}</span><div>${esc(loc.statusNote||"")}${srcs}</div></div>`);
  info.innerHTML=`<div class="ihead"><div style="flex:1;min-width:0"><h2 id="infoTitle" tabindex="-1">${esc(loc.name)}</h2><div class="chips">${chips}</div></div>
    <button class="xbtn" type="button" id="infoClose" aria-label="Close details"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div class="ibody">${body.join("")}</div>`;
  $("#infoClose").onclick=closeInfo;
  info.querySelector(".ibody").scrollTop=0;
}
function layoutInfo(){
  if(isMobile()){ info.style.removeProperty("--px"); return; }
  info.style.setProperty("--px",selAnchor().px+"px");
}
function openInfo(loc){
  renderInfo(loc); layoutInfo();
  info.classList.add("open"); info.setAttribute("aria-hidden","false");
  app.classList.add("sheet-open");
}
function closeInfo(){
  if(state.sel===null) return;
  const id=state.sel; state.sel=null;
  info.classList.remove("open"); info.setAttribute("aria-hidden","true"); app.classList.remove("sheet-open");
  paintMarkers(); renderLegendList();
  const el=markersEl.querySelector(`[data-id="${id}"]`); if(el) el.focus({preventScroll:true});
}
function selectLoc(id,opts={}){
  const loc=byId[id]; if(!loc) return;
  state.lastFocus=document.activeElement;
  if(state.cityOpen) toggleCity(false);
  if(isMobile() && state.legendOpen) toggleLegend(false);
  state.sel=id; hideTip(); paintMarkers(); openInfo(loc); renderLegendList();
  if(loc.pos) flyToLoc(loc); live(`${loc.name}. ${catOf(loc.cat).label}.`);
  setTimeout(()=>{ const h=$("#infoTitle"); if(h && !opts.noFocus) h.focus({preventScroll:true}); },320);
}

    + (f.kind!=="all"?`<button class="reset" type="button" id="showAll">Show all locations</button>`:"");

    if(state.sel!==null && !matches(byId[state.sel])) closeInfo();

/* The legend is an independent layer: right-anchored, opaque, and it never touches the map's transform.
   On desktop it takes the footprint of the legend printed on the original image (projected through the home view),
   so it sits exactly over it. On tablets and phones it is a full-height drawer on the right edge. */
function placeLegend(){
  if(isDrawer()){
    ["--lg-right","--lg-top","--lg-w","--lg-h"].forEach(p=>legend.style.removeProperty(p));
    lg={right:0,w:Math.min(vw*(isMobile()?.88:.86), isMobile()?360:320)};
    return;
  }
  const w=vw<1280?320:360, right=12, top=70, height=Math.min(vh-top-12,860);
  legend.style.setProperty("--lg-right",right+"px"); legend.style.setProperty("--lg-top",top+"px");
  legend.style.setProperty("--lg-w",w+"px"); legend.style.setProperty("--lg-h",height+"px");
  lg={right,w};
  app.style.setProperty("--lg-right",right+"px"); app.style.setProperty("--lg-w",w+"px");
}
function toggleLegend(open,quiet){
  state.legendOpen = open===undefined ? !state.legendOpen : open;

  $("#btnLegend").setAttribute("aria-expanded",state.legendOpen);
  app.classList.toggle("legend-open",state.legendOpen);
  app.classList.toggle("sheet-open",(isMobile()&&state.legendOpen)||state.cityOpen||state.sel!==null);
  layoutInfo();
  if(state.legendOpen && !quiet) setTimeout(()=>{const b=legend.querySelector(".row[aria-pressed='true']"); b&&b.focus({preventScroll:true})},60);
}
$("#btnLegend").onclick=()=>toggleLegend();

/* =====================================================================
   LocationSearch  (searches the location records, not the on-screen text)
   ===================================================================== */
const q=$("#q"), sug=$("#suggest"), qclear=$("#qclear");
let results=[], active=-1;
function haystacks(l){
  const c=catOf(l.cat), cats=l.cats.map(id=>catOf(id).label), th=l.themes.map(id=>themeOf(id).label);
  return {
    name:l.name.toLowerCase(), alias:l.aliases.join(" ").toLowerCase(),
    cat:[c.label,...cats,...th].join(" ").toLowerCase(),
    kw:l.keywords.join(" ").toLowerCase(),
    text:[l.type,l.locText,l.background,...(l.activities||[]),l.short,l.overview,...(l.details||[]),...l.features,...l.experience,...l.facilities,...l.access, l.kind==="icon"?c.note:""].join(" ").toLowerCase()
  };
}
const HAY=Object.fromEntries(LOCATIONS.map(l=>[l.id,haystacks(l)]));
function search(term){
  const toks=term.toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const out=[];
  LOCATIONS.forEach(l=>{
    const h=HAY[l.id]; let score=0, why="", ok=true;
    for(const t of toks){
      let s=0, w="";
      if(h.name.startsWith(t)) {s=100;w="Name";}
      else if(h.name.includes(t)) {s=80;w="Name";}
      else if(h.alias.includes(t)) {s=70;w="Also known as";}
      else if(h.kw.includes(t)) {s=50;w="Keyword";}
      else if(h.cat.includes(t)) {s=40;w="Category";}
      else if(h.text.includes(t)) {s=20;w="Description";}
      if(!s){ok=false;break;}
      score+=s; if(!why||s>score/toks.length) why=w;
    }
    if(ok) out.push({l,score,why});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}
function renderSuggest(){
  const term=q.value.trim();
  qclear.style.display=term?"block":"none";
  if(!term){ closeSuggest(); return; }
  results=search(term); active=results.length?0:-1;
  if(!results.length){
    sug.innerHTML=`<div class="sgnone">No places match <b>“${esc(term)}”</b>. Try a place name such as <b>Caasinan</b>, or a word like <b>beach</b>, <b>spring</b> or <b>hotel</b>.</div>`;
  }else{
    sug.innerHTML=results.map((r,i)=>`<button type="button" class="sg" role="option" id="sg${i}" data-i="${i}" aria-selected="${i===0}">${swatch(catOf(r.l.cat),30)}<span><span class="t">${esc(r.l.name)}</span><br><span class="s">${esc(catOf(r.l.cat).label)}</span></span><span class="why">${r.why}</span></button>`).join("");
    sug.querySelectorAll(".sg").forEach(b=>{
      b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>pick(+b.dataset.i);
      b.onmousemove=()=>setActive(+b.dataset.i);
    });
  }
  sug.classList.add("open"); q.setAttribute("aria-expanded","true");
  q.setAttribute("aria-activedescendant",active>=0?"sg"+active:"");
}
function closeSuggest(){ sug.classList.remove("open"); q.setAttribute("aria-expanded","false"); q.removeAttribute("aria-activedescendant"); }
function setActive(i){
  active=i; sug.querySelectorAll(".sg").forEach((b,j)=>b.setAttribute("aria-selected",j===i));
  q.setAttribute("aria-activedescendant","sg"+i);
  const el=$("#sg"+i); if(el) el.scrollIntoView({block:"nearest"});
}
function pick(i){
  const r=results[i]; if(!r) return;
  closeSuggest(); q.value=r.l.name; qclear.style.display="block"; q.blur();
  // search must always be able to reach the place, so clear a filter that would hide it
  if(!matches(r.l)) setFilter("all",null,false);
  selectLoc(r.l.id);
}
q.addEventListener("input",renderSuggest);
q.addEventListener("focus",()=>{ if(q.value.trim()) renderSuggest(); });
q.addEventListener("blur",()=>setTimeout(closeSuggest,120));
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); if(results.length) setActive((active+1)%results.length); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(results.length) setActive((active-1+results.length)%results.length); }
  else if(e.key==="Enter"){ e.preventDefault(); if(results.length) pick(Math.max(0,active)); }
  else if(e.key==="Escape"){ if(sug.classList.contains("open")) {closeSuggest(); e.stopPropagation();} else { q.value=""; qclear.style.display="none"; } }
});
qclear.onclick=()=>{ q.value=""; qclear.style.display="none"; closeSuggest(); q.focus(); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !e.defaultPrevented){
    if(state.sel!==null) closeInfo();
    else if(state.cityOpen) toggleCity(false);
    else if(state.legendOpen) toggleLegend(false);
  }
  if(e.key==="/" && document.activeElement===document.body){ e.preventDefault(); q.focus(); }
});

/* Procedural palm fronds for the static corners of the tropical background (vector, so always sharp) */
function buildBackground(){
  if(reduceMotion()||navigator.connection&&navigator.connection.saveData||((navigator.hardwareConcurrency||8)<=4&&isMobile())) app.classList.add("lite");
  const svg=$("#fronds"); let out="";
  const frond=(x,y,len,ang,col,op)=>{
    const a=ang*Math.PI/180, bend=len*.38, ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len;
    const mx=x+Math.cos(a)*len*.5-Math.sin(a)*bend, my=y+Math.sin(a)*len*.5+Math.cos(a)*bend;
    out+=`<g fill="${col}" opacity="${op}"><path d="M${x} ${y}Q${mx} ${my} ${ex} ${ey}" fill="none" stroke="${col}" stroke-width="3"/>`;
    for(let i=1;i<=15;i++){
      const t=i/16, px=(1-t)*(1-t)*x+2*(1-t)*t*mx+t*t*ex, py=(1-t)*(1-t)*y+2*(1-t)*t*my+t*t*ey;
      const tx=2*(1-t)*(mx-x)+2*t*(ex-mx), ty=2*(1-t)*(my-y)+2*t*(ey-my), ta=Math.atan2(ty,tx)*180/Math.PI;
      const L=len*.2*(1-t*.55);
      out+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${L.toFixed(1)}" ry="${(L*.17).toFixed(1)}" transform="rotate(${(ta+62).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}) translate(${(L*.8).toFixed(1)} 0)"/>`+
           `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${L.toFixed(1)}" ry="${(L*.17).toFixed(1)}" transform="rotate(${(ta-62).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}) translate(${(L*.8).toFixed(1)} 0)"/>`;
    }
    out+="</g>";
  };
  frond(-20,640,430,-52,"#2f7a3e",.55); frond(10,640,330,-20,"#3d8f45",.5); frond(-10,640,380,-80,"#256a38",.5);
  frond(1020,640,430,-128,"#2f7a3e",.55); frond(990,640,330,-160,"#3d8f45",.5); frond(1010,640,380,-100,"#256a38",.5);
  svg.innerHTML=out;
}
function boot(){
  const css=getComputedStyle(document.documentElement).getPropertyValue("--map");
  const m=css.match(/url\(\s*["']?([^"')]+)["']?\s*\)/);
  const done=()=>{
    measure(); buildBackground(); buildMarkers(); buildLegend(); buildCity(); paintMarkers(); placeLegend();
    view=Object.assign({},homeView()); applyView(); atFit=true; ready=true;
    $("#loading").classList.add("done");
    setTimeout(()=>{const l=$("#loading"); l.style.display="none"},600);
    setTimeout(()=>$("#hint").classList.add("off"),7000);
    live(`Map loaded. ${LOCATIONS.filter(l=>l.pos).length} places on the map.`);
  };
  if(!m){ fail("The map image is missing."); return; }
  const img=new Image();
  img.onload=()=>{ (img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(done); };
  img.onerror=()=>fail("The map image could not be loaded.");
  img.src=m[1];
}
function fail(msg){
  $("#spin").style.display="none"; $("#ltitle").textContent="The map didn't load"; $("#lmsg").textContent=msg+" Check your connection and try again.";
  if(!$("#retry")){ const b=document.createElement("button"); b.id="retry"; b.type="button"; b.textContent="Reload"; b.onclick=()=>location.reload(); $("#loading .box").appendChild(b); }
}
boot();
</script>
